name: Sintonia
options:
  bundleIdPrefix: com.sintonia
  deploymentTarget:
    iOS: "27.2"
    macOS: "27.2"
  createIntermediateGroups: true
packages:
  SintoniaCore:
    path: Packages/SintoniaCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Sintonia:
    type: application
    platform: iOS
    deploymentTarget: "27.2"
    sources:
      - path: App/Sources/AudioRuntime
      - path: App/Sources/StudioUI
      - path: App/iOS
      - path: App/Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Sintonia
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: Sintonia Preset
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.sintonia.preset
              - com.waveforge.preset
          - CFBundleTypeName: BrainWave Generator Preset
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.noromaa.bwg
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.sintonia.preset
            UTTypeDescription: Sintonia Preset
            UTTypeConformsTo:
              - public.json
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - sintonia
              public.mime-type:
                - application/vnd.sintonia.preset+json
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.waveforge.preset
            UTTypeDescription: WaveForge Preset (legacy)
            UTTypeConformsTo:
              - public.json
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - waveforge
              public.mime-type:
                - application/vnd.waveforge.preset+json
          - UTTypeIdentifier: com.noromaa.bwg
            UTTypeDescription: BrainWave Generator Preset
            UTTypeConformsTo:
              - public.data
              - public.content
            UTTypeTagSpecification:
              public.filename-extension:
                - bwg
              public.mime-type:
                - application/x-bwg
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sintonia.app
        DEVELOPMENT_TEAM: Y6A9LRQDH7
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "27.2"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    dependencies:
      - package: SintoniaCore
        product: SynthCore
      - package: SintoniaCore
        product: PresetKit
      - package: SintoniaCore
        product: SintoniaExport
    scheme:
      testTargets:
        - SintoniaTests
  SintoniaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "27.2"
    sources:
      - path: App/Tests/AudioRuntimeTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sintonia.tests
        IPHONEOS_DEPLOYMENT_TARGET: "27.2"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: Sintonia
      - package: SintoniaCore
        product: SynthCore
      - package: SintoniaCore
        product: PresetKit
      - package: SintoniaCore
        product: SintoniaExport
  SintoniaMac:
    type: application
    platform: macOS
    deploymentTarget: "27.2"
    sources:
      - path: App/Sources/AudioRuntime
      - path: App/Sources/StudioUI
      - path: App/Sources/MacUI
      - path: App/Mac
        excludes:
          - SintoniaMac.entitlements
          - Info.plist
      - path: App/Resources
    info:
      path: App/Mac/Info.plist
      properties:
        CFBundleDisplayName: Sintonia
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Sintonia Preset
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.sintonia.preset
              - com.waveforge.preset
          - CFBundleTypeName: BrainWave Generator Preset
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.noromaa.bwg
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.sintonia.preset
            UTTypeDescription: Sintonia Preset
            UTTypeConformsTo:
              - public.json
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - sintonia
              public.mime-type:
                - application/vnd.sintonia.preset+json
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.waveforge.preset
            UTTypeDescription: WaveForge Preset (legacy)
            UTTypeConformsTo:
              - public.json
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - waveforge
              public.mime-type:
                - application/vnd.waveforge.preset+json
          - UTTypeIdentifier: com.noromaa.bwg
            UTTypeDescription: BrainWave Generator Preset
            UTTypeConformsTo:
              - public.data
              - public.content
            UTTypeTagSpecification:
              public.filename-extension:
                - bwg
              public.mime-type:
                - application/x-bwg
    entitlements:
      path: App/Mac/SintoniaMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_NAME: Sintonia
        PRODUCT_MODULE_NAME: SintoniaMac
        PRODUCT_BUNDLE_IDENTIFIER: com.sintonia.mac
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "27.2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Mac/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Mac/SintoniaMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: SintoniaCore
        product: SynthCore
      - package: SintoniaCore
        product: PresetKit
      - package: SintoniaCore
        product: SintoniaExport
    scheme:
      testTargets:
        - SintoniaMacTests
  SintoniaMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "27.2"
    sources:
      - path: App/Tests/MacRuntimeTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sintonia.mac.tests
        MACOSX_DEPLOYMENT_TARGET: "27.2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Sintonia.app/Contents/MacOS/Sintonia"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: SintoniaMac
      - package: SintoniaCore
        product: SynthCore
      - package: SintoniaCore
        product: PresetKit
      - package: SintoniaCore
        product: SintoniaExport
